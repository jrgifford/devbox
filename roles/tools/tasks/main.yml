---
# Additional tools not managed by mise

- name: Install git-lfs
  ansible.builtin.apt:
    name: git-lfs
    state: present
    update_cache: true

- name: Initialize git-lfs
  become: true
  become_user: "{{ dev_user }}"
  ansible.builtin.command: git lfs install
  args:
    creates: "{{ dev_user_home }}/.gitconfig"
  register: git_lfs
  changed_when: git_lfs.rc == 0
