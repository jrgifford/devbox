---
# AI Coding Agents - installed via mise, this role just verifies

- name: Set mise paths
  ansible.builtin.set_fact:
    mise_shims: "{{ dev_user_home }}/.local/share/mise/shims"

- name: Verify Claude Code installation
  ansible.builtin.shell: |
    export PATH="{{ mise_shims }}:{{ dev_user_home }}/.local/bin:$PATH"
    claude --version
  become: true
  become_user: "{{ dev_user }}"
  register: claude_version
  changed_when: false
  failed_when: false

- name: Show Claude Code version
  ansible.builtin.debug:
    msg: "Claude Code: {{ claude_version.stdout | default('not installed') }}"

- name: Verify Codex CLI installation
  ansible.builtin.shell: |
    export PATH="{{ mise_shims }}:{{ dev_user_home }}/.local/bin:$PATH"
    codex --version
  become: true
  become_user: "{{ dev_user }}"
  register: codex_version
  changed_when: false
  failed_when: false

- name: Show Codex CLI version
  ansible.builtin.debug:
    msg: "Codex CLI: {{ codex_version.stdout | default('not installed') }}"

- name: Verify Gemini CLI installation
  ansible.builtin.shell: |
    export PATH="{{ mise_shims }}:{{ dev_user_home }}/.local/bin:$PATH"
    gemini --version
  become: true
  become_user: "{{ dev_user }}"
  register: gemini_version
  changed_when: false
  failed_when: false

- name: Show Gemini CLI version
  ansible.builtin.debug:
    msg: "Gemini CLI: {{ gemini_version.stdout | default('not installed') }}"
