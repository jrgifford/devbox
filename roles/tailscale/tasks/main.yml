---
# Tailscale installation and configuration

- name: Install Tailscale via official script
  ansible.builtin.shell: |
    curl -fsSL https://tailscale.com/install.sh | sh
  args:
    creates: /usr/bin/tailscale

- name: Enable Tailscale service
  ansible.builtin.systemd:
    name: tailscaled
    enabled: true
    state: started

- name: Check if Tailscale is already connected
  ansible.builtin.command: tailscale status
  register: tailscale_status
  changed_when: false
  failed_when: false

- name: Join Tailscale network
  ansible.builtin.command: >
    tailscale up
    --auth-key={{ tailscale_auth_key }}
    --hostname={{ tailscale_hostname }}
  when:
    - tailscale_auth_key | length > 0
    - "'Logged out' in tailscale_status.stdout or tailscale_status.rc != 0"
  no_log: true  # Hide auth key from logs
