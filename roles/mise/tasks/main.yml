---
# mise version manager - manages all language runtimes and CLI tools

- name: Check if mise is installed
  ansible.builtin.stat:
    path: "{{ dev_user_home }}/.local/bin/mise"
  register: mise_binary

- name: Install mise
  ansible.builtin.shell: |
    curl https://mise.run | sh
  args:
    creates: "{{ dev_user_home }}/.local/bin/mise"
  become: true
  become_user: "{{ dev_user }}"
  environment:
    HOME: "{{ dev_user_home }}"
  when: not mise_binary.stat.exists

- name: Ensure ~/.local/bin exists
  ansible.builtin.file:
    path: "{{ dev_user_home }}/.local/bin"
    state: directory
    owner: "{{ dev_user }}"
    group: "{{ dev_user }}"
    mode: "0755"

- name: Add mise paths to .bashrc
  ansible.builtin.blockinfile:
    path: "{{ dev_user_home }}/.bashrc"
    create: true
    marker: "# {mark} MISE MANAGED BLOCK"
    block: |
      export PATH="$HOME/.local/bin:$HOME/.local/share/mise/shims:$PATH"
      eval "$(~/.local/bin/mise activate bash)"
  become: true
  become_user: "{{ dev_user }}"

- name: Add mise paths to .zshrc
  ansible.builtin.blockinfile:
    path: "{{ dev_user_home }}/.zshrc"
    create: true
    marker: "# {mark} MISE MANAGED BLOCK"
    block: |
      export PATH="$HOME/.local/bin:$HOME/.local/share/mise/shims:$PATH"
      eval "$(~/.local/bin/mise activate zsh)"
  become: true
  become_user: "{{ dev_user }}"

- name: Create mise config directory
  ansible.builtin.file:
    path: "{{ dev_user_home }}/.config/mise"
    state: directory
    owner: "{{ dev_user }}"
    group: "{{ dev_user }}"
    mode: "0755"

- name: Configure mise settings
  ansible.builtin.copy:
    dest: "{{ dev_user_home }}/.config/mise/config.toml"
    owner: "{{ dev_user }}"
    group: "{{ dev_user }}"
    mode: "0644"
    content: |
      [settings]
      experimental = true
      python_venv_auto_create = true

- name: Trust mise configuration
  ansible.builtin.shell: |
    {{ dev_user_home }}/.local/bin/mise trust --all
  become: true
  become_user: "{{ dev_user }}"
  environment:
    HOME: "{{ dev_user_home }}"
  changed_when: false
  failed_when: false

# Install language runtimes via mise
- name: Install language runtimes via mise
  ansible.builtin.shell: |
    {{ dev_user_home }}/.local/bin/mise use --global {{ item.name }}@{{ item.version }}
  become: true
  become_user: "{{ dev_user }}"
  environment:
    HOME: "{{ dev_user_home }}"
    GITHUB_TOKEN: "{{ lookup('env', 'GITHUB_TOKEN') | default(omit) }}"
  loop: "{{ mise_runtimes }}"
  loop_control:
    label: "{{ item.name }}@{{ item.version }}"
  register: runtime_install
  changed_when: "'installed' in runtime_install.stderr or 'installed' in runtime_install.stdout"
  failed_when: false

- name: Report runtime installation failures
  ansible.builtin.debug:
    msg: "WARNING: Failed to install {{ item.item.name }}@{{ item.item.version }}: {{ item.stderr | default('unknown error') }}"
  loop: "{{ runtime_install.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: item.rc != 0

# Install CLI tools via mise
- name: Install CLI tools via mise
  ansible.builtin.shell: |
    {{ dev_user_home }}/.local/bin/mise use --global {{ item.name }}@{{ item.version }}
  become: true
  become_user: "{{ dev_user }}"
  environment:
    HOME: "{{ dev_user_home }}"
    GITHUB_TOKEN: "{{ lookup('env', 'GITHUB_TOKEN') | default(omit) }}"
  loop: "{{ mise_tools }}"
  loop_control:
    label: "{{ item.name }}@{{ item.version }}"
  register: tool_install
  changed_when: "'installed' in tool_install.stderr or 'installed' in tool_install.stdout"
  failed_when: false

- name: Report tool installation failures
  ansible.builtin.debug:
    msg: "WARNING: Failed to install {{ item.item.name }}@{{ item.item.version }}: {{ item.stderr | default('unknown error') }}"
  loop: "{{ tool_install.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: item.rc != 0

- name: Verify mise installation
  ansible.builtin.shell: |
    {{ dev_user_home }}/.local/bin/mise --version
  become: true
  become_user: "{{ dev_user }}"
  register: mise_version
  changed_when: false

- name: Show mise version
  ansible.builtin.debug:
    msg: "mise version: {{ mise_version.stdout }}"

- name: Show installed tools and runtimes
  ansible.builtin.shell: |
    {{ dev_user_home }}/.local/bin/mise list
  become: true
  become_user: "{{ dev_user }}"
  environment:
    HOME: "{{ dev_user_home }}"
  register: mise_list
  changed_when: false

- name: Display installed tools and runtimes
  ansible.builtin.debug:
    msg: "{{ mise_list.stdout_lines }}"
