---
# Shared variables for all hosts

# User configuration
dev_user: ubuntu
dev_user_home: /home/ubuntu

# Timezone
timezone: America/New_York

# Tailscale configuration
# Auth key is read from TAILSCALE_AUTH_KEY environment variable
tailscale_auth_key: "{{ lookup('env', 'TAILSCALE_AUTH_KEY') }}"
tailscale_hostname: devbox

# mise-managed language runtimes
mise_runtimes:
  - name: python
    version: "3.12.12"
  - name: node
    version: "22.22.0"
  - name: ruby
    version: "3.4.13"
  - name: go
    version: "latest"
  - name: rust
    version: "stable"

# mise-managed tools (installed via mise)
mise_tools:
  - name: uv
    version: "latest"
  - name: ripgrep
    version: "latest"
  - name: fd
    version: "latest"
  - name: bat
    version: "latest"
  - name: fzf
    version: "latest"
  - name: lazygit
    version: "latest"
  - name: jq
    version: "latest"
  - name: yq
    version: "latest"
  - name: delta
    version: "latest"
  # AI coding agents
  - name: claude
    version: "latest"
  - name: codex
    version: "latest"
  - name: gemini
    version: "latest"

# Shell configuration
default_shell: /usr/bin/zsh
