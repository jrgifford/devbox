---
# Shared variables for all hosts

# User configuration
dev_user: ubuntu
dev_user_home: /home/ubuntu

# Timezone
timezone: America/New_York

# Tailscale configuration
# Auth key is read from TAILSCALE_AUTH_KEY environment variable
tailscale_auth_key: "{{ lookup('env', 'TAILSCALE_AUTH_KEY') }}"
tailscale_hostname: devbox

# mise-managed language versions
mise_ruby_version: "latest"
mise_python_version: "latest"
mise_node_version: "lts"
mise_go_version: "latest"
mise_rust_version: "stable"

# Shell configuration
default_shell: /usr/bin/zsh
